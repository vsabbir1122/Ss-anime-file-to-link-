      - key: ""
      - key: API_ID
        value: "29608422"
      - key: API_HASH
        value: "3db2f8e109301f02f5d9c8f10dd79244"
      - key: BOT_TOKEN
        value: "CONFIGURED_IN_SERVER_ENV"
      - key: BIN_CHANNEL
        value: "-1004450462812"
      - key: ADMINS
        value: "8056243176"
      - key: MIN_FILE_SIZE_MB
        value: "10"
